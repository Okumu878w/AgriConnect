{% extends "main.html" %}
{% block content %}
{%load static%}
<link rel="stylesheet" href="{%static 'css/main.css'%}">
<link rel="stylesheet" href="{%static 'bootstrap/css/bootstrap.min.css'%}">
<div class="sellercontent flex-grow-1 p-4 "style="font-family:  sans-serif;">
    <div class="inventory-container ">
        <div class="inventory-header">
            <h2>My Inventory</h2>
            <button class="rounded-2 "><a href="{%url 'add'%}" class=" "><span><svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#1f1f1f"><path d="M444-144v-300H144v-72h300v-300h72v300h300v72H516v300h-72Z"/></svg></span> Add item</a></button>
        </div>

        <table class="inventory-table">
            <thead>
                <tr>
                    <th style="width: 25%;">Product Name</th>
                    <th style="width: 20%;">Category</th>
                    <th style="width: 20%;">Price</th>
                    
                    <th style="width: 15%;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- for loop here -->
                 {%for product in products%}
                <tr>
                    <td class="product-name">{{product.name}}</td>
                    <td><span class="category-badge">{{product.category}}</span></td>
                    <td class="price">{{product.price}}</td>
                    
                    <td class="actions">
                        <a href="{%url 'update' product.id%}" class="edit-btn">Edit</a>
                        <a href="{%url 'delete' product.id%}" class="delete-btn">Delete</a>
                    </td>
                </tr>
                {%endfor%}

                

                
            </tbody>
        </table>
    </div>



</div>

{% endblock  %}
